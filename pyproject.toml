[project]
name = "StackingRobot"
version = "0.1.0"
description = "An object stacking robot"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.15.0",
    "ikpy>=4.1.0",
    "opencv-python>=4.10,<5",
    "pillow>=13.0.0",
    "pybullet>=3.2.7",
    "xarm>=0.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xarm_ik", "cup_stacking"]
